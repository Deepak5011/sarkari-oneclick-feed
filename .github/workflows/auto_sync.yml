name: Auto Sync Sarkari Exams JSON

on:
  schedule:
    - cron: '37 1 * * *'   # ~07:07 AM IST (Morning)
    - cron: '43 5 * * *'   # ~11:13 AM IST (Late Morning)
    - cron: '23 9 * * *'   # ~02:53 PM IST (Afternoon)
    - cron: '51 13 * * *'  # ~07:21 PM IST (Evening)
    - cron: '19 17 * * *'  # ~10:49 PM IST (Night)
  workflow_dispatch:       # 1-click manual trigger from GitHub Actions

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests cloudscraper beautifulsoup4 lxml

      - name: Run Exam Scraper Script
        run: python scripts/update_exams.py

      - name: Commit and Push Updated JSON
        run: |
          git config --global user.name "Sarkari One-Click Bot"
          git config --global user.email "bot@noreply.github.com"
          git add live_exams.json
          git diff --staged --quiet || git commit -m "Auto-update live_exams.json"
          git push
